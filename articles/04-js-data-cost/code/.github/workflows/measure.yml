name: measure

# Re-measures every site and refreshes prices and income data, then commits
# the results. Runs on the 1st of each month, or on demand from the Actions tab.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 1 * *'

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run fetch:prices
      - run: npm run fetch:income
      - run: npm run measure
      - run: npm run report
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data results docs/images
          git diff --cached --quiet || git commit -m "Update measurements ($(date -u +%Y-%m-%d))"
          git push
