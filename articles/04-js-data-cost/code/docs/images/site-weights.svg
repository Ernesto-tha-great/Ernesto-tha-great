  .h1 { font-size: 22px; font-weight: 700; } .sub { font-size: 14px; fill: var(--ink-2); }
  .lbl { font-size: 12.5px; fill: var(--ink-2); } .val { font-size: 12px; font-weight: 600; } .note { font-size: 12px; fill: var(--ink-3); }
