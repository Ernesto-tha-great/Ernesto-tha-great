<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 562" width="1200" height="562" role="img" aria-labelledby="t d">
<title id="t">Delivery outcomes by strategy across four network traces</title>
<desc id="d">For each trace, a 100% stacked bar per strategy shows the share of user actions delivered exactly once, duplicated, or lost. The checked-luggage strategy delivers 100% exactly once on every trace.</desc>
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#8a8983; --rule:#e4e3de; --good:#0ca30c; --warning:#fab219; --critical:#d03b3b; }
  @media (prefers-color-scheme: dark) { svg { --surface:#1a1a19; --ink:#ffffff; --ink-2:#c3c2b7; --ink-3:#8f8e86; --rule:#383835; } }
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
  .h1 { font-size: 22px; font-weight: 700; }
  .sub { font-size: 14px; fill: var(--ink-2); }
  .h2 { font-size: 15px; font-weight: 600; }
  .lbl { font-size: 13px; fill: var(--ink-2); }
  .val { font-size: 13px; font-weight: 600; }
  .note { font-size: 12px; fill: var(--ink-3); }
</style>
<rect width="100%" height="100%" fill="var(--surface)"/>
<text class="h1" x="40" y="44">How often did each order reach the server exactly once?</text>
<text class="sub" x="40" y="68">Share of user actions per outcome. 25 seeded runs per trace and strategy, synthetic traces.</text>
<rect x="40" y="86" width="14" height="14" rx="3" fill="var(--good)"/>
<text class="lbl" x="60" y="98">Exactly once</text>
<rect x="172.8" y="86" width="14" height="14" rx="3" fill="var(--warning)"/>
<text class="lbl" x="192.8" y="98">Duplicated</text>
<rect x="290.8" y="86" width="14" height="14" rx="3" fill="var(--critical)"/>
<text class="lbl" x="310.8" y="98">Lost</text>
<text class="h2" x="40" y="138">Underground commute (20 min)</text>
<text class="lbl" x="40" y="170.5">Fire and forget</text>
<clipPath id="clip-0-0"><rect x="200" y="154" width="210" height="24" rx="4"/></clipPath>
<g clip-path="url(#clip-0-0)">
<rect x="200.0" y="154" width="72.5" height="24" fill="var(--good)"/>
<rect x="274.5" y="154" width="133.5" height="24" fill="var(--critical)"/>
</g>
<text class="val" x="422" y="170.5">35.5%</text>
<text class="note" x="472" y="170.5">64.5% lost</text>
<text class="lbl" x="40" y="210.5">Retry in memory</text>
<clipPath id="clip-0-1"><rect x="200" y="194" width="210" height="24" rx="4"/></clipPath>
<g clip-path="url(#clip-0-1)">
<rect x="200.0" y="194" width="153.0" height="24" fill="var(--good)"/>
<rect x="355.0" y="194" width="3.2" height="24" fill="var(--warning)"/>
<rect x="360.1" y="194" width="47.9" height="24" fill="var(--critical)"/>
</g>
<text class="val" x="422" y="210.5">73.8%</text>
<text class="note" x="472" y="210.5">2.5% dup · 23.7% lost</text>
<text class="lbl" x="40" y="250.5">Durable queue, no tags</text>
<clipPath id="clip-0-2"><rect x="200" y="234" width="210" height="24" rx="4"/></clipPath>
<g clip-path="url(#clip-0-2)">
<rect x="200.0" y="234" width="196.3" height="24" fill="var(--good)"/>
<rect x="398.3" y="234" width="9.7" height="24" fill="var(--warning)"/>
</g>
<text class="val" x="422" y="250.5">94.4%</text>
<text class="note" x="472" y="250.5">5.6% dup</text>
<text class="lbl" x="40" y="290.5">Checked luggage</text>
<clipPath id="clip-0-3"><rect x="200" y="274" width="210" height="24" rx="4"/></clipPath>
<g clip-path="url(#clip-0-3)">
<rect x="200.0" y="274" width="208.0" height="24" fill="var(--good)"/>
</g>
<text class="val" x="422" y="290.5">100.0%</text>
<text class="h2" x="640" y="138">SIM over its data cap (15 min)</text>
<text class="lbl" x="640" y="170.5">Fire and forget</text>
