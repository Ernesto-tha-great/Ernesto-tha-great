<text class="axis" x="78" y="204" text-anchor="end">75%</text>
<line x1="90" x2="990" y1="120" y2="120" stroke="var(--rule)"/>
<text class="axis" x="78" y="124" text-anchor="end">100%</text>
<text class="axis" x="90" y="462" text-anchor="middle">day 0</text>
<text class="axis" x="240" y="462" text-anchor="middle">day 5</text>
<text class="axis" x="390" y="462" text-anchor="middle">day 10</text>
<text class="axis" x="540" y="462" text-anchor="middle">day 15</text>
<text class="axis" x="690" y="462" text-anchor="middle">day 20</text>
<text class="axis" x="840" y="462" text-anchor="middle">day 25</text>
<text class="axis" x="990" y="462" text-anchor="middle">day 30</text>
<line x1="180" x2="180" y1="120" y2="440" stroke="var(--ink-3)" stroke-dasharray="4 4"/>
<text class="axis" x="186" y="134">nudge email (day 3)</text>
