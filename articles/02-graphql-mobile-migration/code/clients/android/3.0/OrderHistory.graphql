query OrderHistory($first: Int!, $after: String) {
  viewer {
    orders(first: $first, after: $after) {
      edges {
        node {
          id
          status
          placedAt
          total {
            formatted
          }
          lineItems {
            quantity
            product {
              id
              name
              price_cents
            }
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
