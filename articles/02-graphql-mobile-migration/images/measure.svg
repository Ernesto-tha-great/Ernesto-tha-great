<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 348" width="1200" height="348" role="img" aria-labelledby="t d">
<title id="t">Cost of the order history screen per schema</title>
<desc id="d">Android 2.3 on v1 (all 100 orders): 401 statements, 59.4 ms median; Android 2.3 on v2, app unchanged (all 100 orders): 3 statements, 7.8 ms median; iOS 3.1 on v2 (first 20 orders): 4 statements, 7.1 ms median.</desc>
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#8a8983; --bar:#2a78d6; --rule:#e4e3de; }
  @media (prefers-color-scheme: dark) { svg { --surface:#1a1a19; --ink:#ffffff; --ink-2:#c3c2b7; --ink-3:#8f8e86; --bar:#3987e5; --rule:#383835; } }
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
  .h1 { font-size: 22px; font-weight: 700; }
  .sub { font-size: 14px; fill: var(--ink-2); }
  .h2 { font-size: 15px; font-weight: 600; }
  .lbl { font-size: 13px; fill: var(--ink-2); }
  .val { font-size: 13px; font-weight: 600; }
  .note { font-size: 12px; fill: var(--ink-3); }
</style>
<rect width="100%" height="100%" fill="var(--surface)"/>
<text class="h1" x="40" y="44">One screen, three ways</text>
<text class="sub" x="40" y="68">The order history screen. In-memory SQLite with 1 ms per statement and a pool of 10 connections; 30 runs each.</text>
<text class="h2" x="40" y="110">SQL statements per request</text>
<text class="lbl" x="40" y="157">Android 2.3 on v1 (all 100 orders)</text>
<rect x="370" y="142" width="180.0" height="22" rx="4" fill="var(--bar)"/>
<text class="val" x="560" y="158">401</text>
<text class="lbl" x="40" y="203">Android 2.3 on v2, app unchanged (all 100 orders)</text>
<rect x="370" y="188" width="2.0" height="22" rx="4" fill="var(--bar)"/>
<text class="val" x="382" y="204">3</text>
<text class="lbl" x="40" y="249">iOS 3.1 on v2 (first 20 orders)</text>
<rect x="370" y="234" width="2.0" height="22" rx="4" fill="var(--bar)"/>
<text class="val" x="382" y="250">4</text>
<text class="h2" x="640" y="110">Median response time</text>
<rect x="640" y="142" width="180.0" height="22" rx="4" fill="var(--bar)"/>
<text class="val" x="830" y="158">59.4 ms</text>
<rect x="640" y="188" width="23.6" height="22" rx="4" fill="var(--bar)"/>
<text class="val" x="673.6363636363636" y="204">7.8 ms</text>
<rect x="640" y="234" width="21.5" height="22" rx="4" fill="var(--bar)"/>
<text class="val" x="671.5151515151515" y="250">7.1 ms</text>
<text class="note" x="40" y="324">Source: npm run measure. Absolute times depend on your machine; the ratio is the point.</text>
</svg>
